# Mago configuration — https://mago.carthage.software
#
# The Symfony coding standard (https://symfony.com/doc/current/contributing/code/standards.html).
# mago has no symfony preset, and the standard is PSR-12 plus Symfony's own rules,
# so the formatter starts from the psr-12 preset and spells those rules out:
# single quotes, next-line braces for classes and methods, no spaces around
# concatenation, a blank line before `return`, ordered imports, trailing commas
# in multiline arrays and calls. The linter adds Yoda conditions, `++$i`, and the
# Interface and Trait suffixes. The formatter never re-wraps: a wide print width
# plus "preserve breaking" keeps every line where its author put it.

# The lowest PHP tuink supports, so nothing newer slips in
php-version = "8.4"

[source]
paths = ["src", "tests", "example", "features/bootstrap", "behat.dist.php"]
includes = ["vendor"]

[formatter]
preset = "psr-12"
# The preset pads grouping parentheses, which neither PSR-12 nor Symfony does
space-within-grouping-parenthesis = false
print-width = 200
preserve-breaking-argument-list = true
preserve-breaking-parameter-list = true
preserve-breaking-conditional-expression = true
preserve-breaking-attribute-list = true
preserve-breaking-member-access-chain = true
preserve-redundant-logical-binary-expression-parentheses = true
space-around-concatenation-binary-operator = false
space-before-arrow-function-parameter-list-parenthesis = true
empty-line-before-return = true
single-quote = true
tab-width = 4
use-tabs = false
trailing-comma = true
null-type-hint = "question"
control-brace-style = "same_line"
closure-brace-style = "same_line"
function-brace-style = "next_line"
method-brace-style = "next_line"
classlike-brace-style = "always_next_line"
sort-uses = true

[linter]
integrations = ["phpunit"]

[linter.rules]
# A ratchet at today's maximums, not a target: Session is the facade every step
# goes through and TuiContext the step catalog, so both are wide by design;
# Element carries one value per attribute a selector can read. New families of
# checks go to src/Check, which Session only hands out (files(), terminal(), box()). Lower these
# when the code allows; raise them only with a reason in the commit.
cyclomatic-complexity = { threshold = 91 }
too-many-methods = { threshold = 87 }
excessive-parameter-list = { threshold = 12 }
kan-defect = { threshold = 5 }
halstead = { volume-threshold = 1189, effort-threshold = 8471, difficulty-threshold = 14 }
assertion-style = { style = "this" }
interface-name = { psr = true }
trait-name = { psr = true }
prefer-pre-increment = { enabled = true, level = "warning" }
yoda-conditions = { enabled = true, level = "warning", mode = "require" }
ambiguous-function-call = { enabled = true, level = "warning" }
ambiguous-constant-access = { enabled = true, level = "warning" }
