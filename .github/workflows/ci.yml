name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer
      - run: composer update --no-interaction --no-progress
      - run: make validate fmt-check lint analyze audit

  tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: tests (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: zend.assertions=1
          extensions: mbstring, pcntl, posix
          tools: composer
      - run: composer update --no-interaction --no-progress
      - run: make test
      - name: Behat, in process and in a pseudo-terminal
        run: make behat

  mutation:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    name: mutation testing (100% MSI)
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov
          ini-values: zend.assertions=1
          extensions: mbstring, pcntl, posix
          tools: composer
      - run: composer update --no-interaction --no-progress
      - run: make infection
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: infection-log
          path: var/infection.log
