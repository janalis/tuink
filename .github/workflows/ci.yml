name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer
      - run: composer validate --strict
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --no-progress
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  tests:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: tests (PHP ${{ matrix.php }})
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          ini-values: zend.assertions=1
          extensions: mbstring, pcntl, posix
          tools: composer
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: Behat, in process
        run: vendor/bin/behat --strict --no-colors
      - name: Behat, in a pseudo-terminal
        run: vendor/bin/behat --strict --no-colors --profile=process
