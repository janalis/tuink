name: Feature request
description: Suggest a step, a driver capability or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case and proposed behavior
      description: The scenario you want to write, and what it should check. Use generic examples without personal or confidential information.
      render: gherkin
    validations:
      required: true
